[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

# ============================================================
# Project
# ============================================================

[project]
name = "space-ai"
version = "2.0.0"
description = "Space AI 2.0 - Intelligent Pattern Analysis Engine"
requires-python = ">=3.13"

authors = [
    { name = "Jhon Vivas" }
]

# ============================================================
# Black
# ============================================================

[tool.black]

line-length = 88

target-version = ["py313"]

skip-string-normalization = false

# ============================================================
# isort
# ============================================================

[tool.isort]

profile = "black"

line_length = 88

py_version = 313

combine_as_imports = true

multi_line_output = 3

include_trailing_comma = true

force_grid_wrap = 0

use_parentheses = true

ensure_newline_before_comments = true

# ============================================================
# Ruff
# ============================================================

[tool.ruff]

target-version = "py313"

line-length = 88

exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
]

[tool.ruff.lint]

select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

ignore = [
    "UP046",
]

fixable = ["ALL"]

[tool.ruff.format]

quote-style = "double"

indent-style = "space"

line-ending = "auto"

# ============================================================
# Pytest
# ============================================================

[tool.pytest.ini_options]

pythonpath = [
    "."
]

testpaths = [
    "tests"
]

addopts = [
    "-ra",
]

# ============================================================
# MyPy
# ============================================================

[tool.mypy]

python_version = "3.13"

pretty = true

show_error_codes = true

show_column_numbers = true

show_error_context = true

strict = true

warn_return_any = true

warn_unused_configs = true

warn_unused_ignores = true

warn_redundant_casts = true

warn_unreachable = true

disallow_untyped_defs = true

disallow_any_generics = true

check_untyped_defs = true

no_implicit_optional = true

plugins = []

exclude = [
    "^venv/",
    "^.venv/",
]

# ============================================================
# Coverage (future)
# ============================================================

[tool.coverage.run]

source = [
    "."
]

omit = [
    "tests/*",
]